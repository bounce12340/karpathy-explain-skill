const T={"zh-Hant": {"label": "繁中", "tag": "工程理解工具 · 示意展示", "h1a": "先看懂，", "h1b": "再深入。", "lead": "把難懂的程式與文件，轉成可核對的白話、資料流圖與互動解說。降低閱讀門檻，不刪掉工程判斷必需的證據。", "note": "靈感來自 <a href=\"https://x.com/karpathy/status/2105819303471976479\">Andrej Karpathy 的貼文</a>；這是獨立設計的技能，不是他的官方作品，也沒有實測時間效益宣稱。", "capH": "這個技能能做什麼？", "capP": "先讀真實資料，再選能完成理解任務的最輕形式。每一層都能回到原始來源。", "railLabel": "從原始素材到工程理解的四個步驟", "steps": [["讀來源，建立事實卡", "讀程式、log、PR 或規格；每個結論標記已確認、實測、推論或未知。"], ["30 秒白話", "一句話、具體類比與用途；點出類比不適用之處。"], ["資料流與互動網頁", "畫成功／失敗兩條路；需要切換情境時才做可操作頁面。"], ["深入查證／可選影片", "回到原始碼位置與測試；有需要才製作分鏡與影片。"]], "root": "<strong>始終保留：</strong>來源錨點、授權及資料風險、未知點、可驗證的下一步。圖像不等於正確答案。", "demoH": "切換三個工程情境", "demoP": "以下皆是<strong>合成範例</strong>，展示技能如何讓讀者從一句話走到處理線索；不代表任何實際專案的結論。", "groupLabel": "選擇示範情境", "btn": ["API 回 403", "草稿送出失敗", "CI 一紅一綠"], "h30": "30 秒看懂", "hFlow": "流程圖：資料會走哪裡？", "flowLabel": "主要流程", "ok": "成功路徑", "bad": "失敗／風險路徑", "hDeep": "深入：工程師下一步", "legend": "讀圖方式：由左到右是主流程；下方兩格代表不同結果。手機版改為由上到下。", "then": "，接著", "useH": "如何用在你的程式？", "outA": "交付物", "outAP": "視任務提供分層說明、成功／失敗圖、可互動 HTML，或影片分鏡；不是每次全做。", "outB": "輸入方式", "outBP": "「用 karpathy-explain 給剛接手的工程師解釋〈檔案〉；畫成功與失敗路徑，附來源與未知點。」", "foot": "本頁可離線使用、無外部程式依賴。完整情境見 <a href=\"https://github.com/bounce12340/karpathy-explain-skill/blob/main/examples/examples.md\">三個合成範例</a>、<a href=\"https://github.com/bounce12340/karpathy-explain-skill/blob/main/examples/real-walkthrough.md\">真實演練</a>；技能規則見 <a href=\"https://github.com/bounce12340/karpathy-explain-skill/blob/main/skills/karpathy-explain/SKILL.md\">SKILL.md</a>。", "cases": {"auth": {"topic": "範例 1：已登入，卻收到 403", "summary": "登入像刷卡進大樓；403 可能是進得去大樓，卻沒有權限打開這間資料室。但狀態碼的真正意義，仍須以實際 API 契約為準。", "flow": ["發出請求", "辨識使用者", "查資料的歸屬", "檢查讀取權限"], "success": "授權成立，依契約回傳資料與 200。", "failure": "沒有讀取權限則拒絕。若資料不存在，究竟用 403 或 404，需核對契約。", "checks": ["找身分驗證中介層與讀取資料的查詢條件。", "測「自己的資料／別人的資料／不存在／未登入」四種情況。", "不能用「只要登入就放行」修掉 403。"], "unknown": "合成範例；未提供原始碼，因此沒有可引用的檔案與行號，結論皆為推論。"}, "draft": {"topic": "範例 2：送出失敗，草稿卻不見", "summary": "按下寄出像把信交給郵差；在郵差確認收到，或可靠 uthorization and data risks, unknowns, and a verifiable next step. A picture is not a proof.", "demoH": "Switch between three engineering scenarios", "demoP": "All are <strong>synthetic examples</strong> showing how the skill takes a reader from one sentence to concrete leads. They are not findings about any real project.", "groupLabel": "Choose a demo scenario", "btn": ["API returns 403", "Draft lost on submit", "CI: one red, one green"], "h30": "In 30 seconds", "hFlow": "Flow: where does the data go?", "flowLabel": "Main flow", "ok": "Success path", "bad": "Failure / risk path", "hDeep": "Deep dive: next steps for an engineer", "legend": "How to read: the main flow runs left to right; the two boxes below are the possible outcomes. On mobile it runs top to bottom.", "then": ", then ", "useH": "How do I use it on my code?", "outA": "What you get", "outAP": "Depending on the task: layered explanation, success/failure diagram, interactive HTML, or a video storyboard. Not all of them every time.", "outB": "How to ask", "outBP": "\"Use karpathy-explain to explain <file> to an engineer taking it over; draw the success and failure paths, with sources and unknowns.\"", "foot": "Works offline with no external dependencies. See the <a href=\"https://github.com/bounce12340/karpathy-explain-skill/blob/main/examples/real-walkthrough.md\">real walkthrough</a>, the <a href=\"https://github.com/bounce12340/karpathy-explain-skill/blob/main/examples/examples.en.md\">three synthetic examples</a>, and the skill itself in <a href=\"https://github.com/bounce12340/karpathy-explain-skill/blob/main/skills/karpathy-explain/SKILL.md\">SKILL.md</a>.", "cases": {"auth": {"topic": "Example 1: logged in, still 403", "summary": "Logging in is like badging into a building; a 403 can mean you got into the building but your badge does not open this records room. What the status code really means still depends on the actual API contract.", "flow": ["Send request", "Identify user", "Look up who owns the data", "Check read permission"], "success": "Authorized: return the data with 200, per the contract.", "failure": "No read permission: reject. Whether a missing record returns 403 or 404 must be checked against the contract.", "checks": ["Find the auth middleware and the query conditions for reading the data.", "Test four cases: own data, someone else's data, missing record, not logged in.", "Never \"fix\" the 403 by letting any logged-in user through."], "unknown": "Synthetic example; no source provided, so there are no files or lines to cite and every conclusion is an inference."}, "draft": {"topic": "Example 2: submit fails, draft disappears", "summary": "Pressing send is like handing a letter to the mail carrier; until delivery is confirmed, or a reliable copy is saved, you should not throw away the only draft.", "flow": ["User edits", "Save local draft", "Try to submit", "Wait for confirmation"], "success": "Clear the local draft only after the server truly confirms.", "failure": "Network fails, or the offline copy also fails: keep the only draft and tell the user.", "checks": ["Find the order of clearing the draft vs. sending the request.", "Test recovery when both the network and offline storage fail.", "Test double-clicking submit and slow responses for races."], "unknown": "Synthetic example; a \"reliable copy\" must be proven by testing, not by a function name."}, "ci": {"topic": "Example 3: Node 22 red, Node 24 green", "summary": "Same exam, one examiner calls time, the other says pass; that alone does not tell you whether the code is right or wrong.", "flow": ["Confirm same commit", "Compare both jobs", "Locate the timed-out test", "Check timing and environment"], "success": "Find a reproducible cause, or enough evidence of flakiness; fix and verify.", "failure": "Merging on Node 24's green alone may hide a real Node 22 failure.", "checks": ["Check both jobs' SHA, test command, and runner.", "Rerun the timed-out test alone; check timers, external services, and parallel load.", "A green rerun only suggests flakiness; it is not a root cause."], "unknown": "Synthetic example; no CI logs provided, so it cannot judge any real repository."}}}, "ja": {"label": "日本語", "tag": "エンジニアリング理解ツール · デモ", "h1a": "まず理解し、", "h1b": "それから深く。", "lead": "難しいコードや文書を、検証できる平易な説明、データフロー図、インタラクティブな解説に変えます。読むハードルは下げても、判断に必要な根拠は削りません。", "note": "<a href=\"https://x.com/karpathy/status/2105819303471976479\">Andrej Karpathy の投稿</a>に着想を得た独立したスキルです。本人の公式作品ではなく、時間短縮の実測値も主張しません。", "capH": "このスキルでできること", "capP": "まず実際のソースを読み、目的を果たせる最も軽い形式を選びます。どの層からも元のソースに戻れます。", "railLabel": "素材から理解までの 4 ステップ", "steps": [["ソースを読み、事実カードを作る", "コード、ログ、PR、仕様を読み、各主張に確認済み・テスト済み・推測・不明のタグを付けます。"], ["30 秒の平易な説明", "一文、具体的な例え、その目的。例えが成り立たない点も示します。"], ["データフローとインタラクティブページ", "成功と失敗の経路を描き、シナリオ切替が役立つときだけ操作できるページを作ります。"], ["詳細調査 / 任意の動画", "ソースの行とテストに戻り、必要なときだけ絵コンテや動画を作ります。"]], "root": "<strong>常に残すもの：</strong>ソースのアンカー、認可とデータのリスク、不明点、検証可能な次の一手。図は正しさの証明ではありません。", "demoH": "3 つのエンジニアリングシナリオを切り替える", "demoP": "すべて<strong>合成例</strong>です。一文から具体的な手がかりまで読み手を導く様子を示すもので、実在のプロジェクトの結論ではありません。", "groupLabel": "デモシナリオを選択", "btn": ["API が 403", "送信失敗で下書き消失", "CI が赤と緑"], "h30": "30 秒で理解", "hFlow": "フロー：データはどこへ行く？", "flowLabel": "主なフロー", "ok": "成功経路", "bad": "失敗 / リスク経路", "hDeep": "詳細：エンジニアの次の一手", "legend": "読み方：主なフローは左から右へ。下の 2 つの枠が起こりうる結果です。モバイルでは上から下へ表示します。", "then": "、次に", "useH": "自分のコードでどう使う？", "outA": "得られるもの", "outAP": "タスクに応じて、段階的な説明、成功／失敗の図、インタラクティブ HTML、動画の絵コンテ。毎回すべてではありません。", "outB": "頼み方", "outBP": "「karpathy-explain で、引き継ぐエンジニアに〈ファイル〉を説明して。成功と失敗の経路を図にし、根拠と不明点も付けて。」", "foot": "オフラインで動作し、外部依存はありません。<a href=\"https://github.com/bounce12340/karpathy-explain-skill/blob/main/examples/real-walkthrough.md\">実例ウォークスルー</a>、<a href=\"https://github.com/bounce12340/karpathy-explain-skill/blob/main/examples/examples.en.md\">3 つの合成例</a>、スキル本体の <a href=\"https://github.com/bounce12340/karpathy-explain-skill/blob/main/skills/karpathy-explain/SKILL.md\">SKILL.md</a> もご覧ください。", "cases": {"auth": {"topic": "例 1：ログイン済みなのに 403", "summary": "ログインはビルに入館証で入るようなもの。403 はビルには入れても、この資料室は開けられないという意味かもしれません。ただしステータスコードの本当の意味は実際の API 仕様で確認します。", "flow": ["リクエスト送信", "ユーザーを識別", "データの所有者を確認", "読み取り権限を確認"], "success": "認可されれば、仕様どおり 200 でデータを返します。", "failure": "読み取り権限がなければ拒否。データが存在しない場合に 403 か 404 かは仕様の確認が必要です。", "checks": ["認証ミドルウェアとデータ取得のクエリ条件を探します。", "自分のデータ、他人のデータ、存在しない、未ログインの 4 ケースを試します。", "「ログインしていれば通す」で 403 を直してはいけません。"], "unknown": "合成例です。ソースがないため引用できるファイルや行はなく、結論はすべて推測です。"}, "draft": {"topic": "例 2：送信に失敗し、下書きが消える", "summary": "送信は手紙を郵便配達員に渡すようなもの。受け取りが確認されるか、確実なコピーが保存されるまで、唯一の下書きを捨ててはいけません。", "flow": ["ユーザーが編集", "ローカルに下書き保存", "送信を試行", "確認を待つ"], "success": "サーバーが確実に確認してから、ローカルの下書きを消します。", "failure": "ネットワークが失敗、またはオフライン保存も失敗：唯一の下書きを残し、ユーザーに知らせます。", "checks": ["下書きの削除と送信リクエストの順序を確認します。", "ネットワークとオフライン保存が同時に失敗したときに復元できるか試します。", "送信ボタンの連打や遅い応答による競合を試します。"], "unknown": "合成例です。「確実なコピー」は関数名ではなく実測で証明する必要があります。"}, "ci": {"topic": "例 3：Node 22 が赤、Node 24 が緑", "summary": "同じ試験で、一人の試験官は時間切れ、もう一人は合格と言う。それだけではコードの正誤は判断できません。", "flow": ["同じコミットか確認", "2 つのジョブを比較", "タイムアウトしたテストを特定", "時間と環境の差を確認"], "success": "再現可能な原因、または不安定さの十分な根拠を見つけ、修正して検証します。", "failure": "Node 24 の緑だけでマージすると、Node 22 の本当の障害を見逃すおそれがあります。", "checks": ["両ジョブの SHA、テストコマンド、ランナーを確認します。", "タイムアウトしたテストを単独で再実行し、タイマー、外部サービス、並列負荷を確認します。", "再実行での成功は不安定さを示唆するだけで、根本原因ではありません。"], "unknown": "合成例です。CI ログがないため、実際のリポジトリの状態は判断できません。"}}}, "ko": {"label": "한국어", "tag": "엔지니어링 이해 도구 · 데모", "h1a": "먼저 이해하고,", "h1b": "그다음 깊이.", "lead": "어려운 코드와 문서를 검증 가능한 쉬운 설명, 데이터 흐름도, 인터랙티브 설명으로 바꿉니다. 읽기 장벽은 낮추되 판단에 필요한 근거는 지우지 않습니다.", "note": "<a href=\"https://x.com/karpathy/status/2105819303471976479\">Andrej Karpathy의 게시물</a>에서 영감을 받은 독립 스킬입니다. 그의 공식 작품이 아니며, 시간 절약을 측정했다고 주장하지 않습니다.", "capH": "이 스킬로 무엇을 할 수 있나요?", "capP": "먼저 실제 소스를 읽고, 목적을 달성하는 가장 가벼운 형식을 고릅니다. 모든 단계에서 원래 소스로 돌아갈 수 있습니다.", "railLabel": "원자료에서 이해까지 네 단계", "steps": [["소스를 읽고 사실 카드 만들기", "코드, 로그, PR, 명세를 읽고 모든 주장에 확인됨·테스트됨·추론·미확인 태그를 붙입니다."], ["30초 쉬운 설명", "한 문장, 구체적인 비유, 그 목적. 비유가 맞지 않는 "사용자 편집", "로컬 초안 저장", "제출 시도", "확인 대기"], "success": "서버가 확실히 확인한 뒤에만 로컬 초안을 지웁니다.", "failure": "네트워크 실패 또는 오프라인 저장도 실패: 유일한 초안을 남기고 사용자에게 알립니다.", "checks": ["초안 삭제와 제출 요청의 순서를 확인합니다.", "네트워크와 오프라인 저장이 동시에 실패할 때 복구되는지 테스트합니다.", "제출 버튼 연타와 느린 응답의 경쟁 상태를 테스트합니다."], "unknown": "합성 예시입니다. \"확실한 사본\"은 함수 이름이 아니라 실제 테스트로 증명해야 합니다."}, "ci": {"topic": "예시 3: Node 22 빨강, Node 24 초록", "summary": "같은 시험에서 한 감독관은 시간 초과, 다른 감독관은 합격이라고 합니다. 그것만으로 코드가 맞는지 틀린지 판단할 수 없습니다.", "flow": ["같은 커밋인지 확인", "두 작업 비교", "시간 초과 테스트 찾기", "시간과 환경 차이 확인"], "success": "재현 가능한 원인이나 불안정성의 충분한 근거를 찾아 수정하고 검증합니다.", "failure": "Node 24의 초록만 보고 병합하면 Node 22의 실제 장애를 놓칠 수 있습니다.", "checks": ["두 작업의 SHA, 테스트 명령, 러너를 확인합니다.", "시간 초과 테스트를 단독으로 다시 실행해 타이머, 외부 서비스, 병렬 부하를 확인합니다.", "재실행 성공은 불안정성을 시사할 뿐 근본 원인이 아닙니다."], "unknown": "합성 예시입니다. CI 로그가 없어 실제 저장소 상태를 판단할 수 없습니다."}}}, "zh-Hans": {"label": "简体", "tag": "工程理解工具 · 演示", "h1a": "先看懂，", "h1b": "再深入。", "lead": "把难懂的代码和文档，转成可核对的白话、数据流图与交互讲解。降低阅读门槛，不删掉工程判断必需的证据。", "note": "灵感来自 <a href=\"https://x.com/karpathy/status/2105819303471976479\">Andrej Karpathy 的帖子</a>；这是独立设计的技能，不是他的官方作品，也没有实测时间效益声明。", "capH": "这个技能能做什么？", "capP": "先读真实资料，再选能完成理解任务的最轻形式。每一层都能回到原始来源。", "railLabel": "从原始素材到工程理解的四个步骤", "steps": [["读来源，建立事实卡", "读代码、日志、PR 或规格；每个结论标记已确认、实测、推断或未知。"], ["30 秒白话", "一句话、具体类比与用途；指出类比不适用之处。"], ["数据流与交互网页", "画出成功／失败两条路；需要切换情境时才做可操作页面。"], ["深入核实／可选视频", "回到源码位置与测试；有需要才制作分镜与视频。"]], "root": "<strong>始终保留：</strong>来源锚点、权限及数据风险、未知点、可验证的下一步。图像不等于正确答案。", "demoH": "切换三个工程情境", "demoP": "以下均为<strong>合成示例</strong>，展示技能如何让读者从一句话走到处理线索；不代表任何实际项目的结论。", "groupLabel": "选择演示情境", "btn": ["API 返回 403", "草稿提交失败", "CI 一红一绿"], "h30": "30 秒看懂", "hFlow": "流程图：数据会走哪里？", "flowLabel": "主要流程", "ok": "成功路径", "bad": "失败／风险路径", "hDeep": "深入：工程师下一步", "legend": "读图方式：从左到右是主流程；下方两格代表不同结果。手机版改为从上到下。", "then": "，接着", "useH": "如何用在你的代码上？", "outA": "交付物", "outAP": "视任务提供分层讲解、成功／失败图、可交互 HTML 或视频分镜；不是每次全做。", "outB": "请求方式", "outBP": "“用 karpathy-explain 给刚接手的工程师讲解〈文件〉；画出成功与失败路径，附来源与未知点。”", "foot": "本页可离线使用、无外
