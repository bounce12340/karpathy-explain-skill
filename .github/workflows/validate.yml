name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill format, links, evidence anchors, and secrets
        run: python3 scripts/validate.py
      - name: Unit tests for the validator
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check skills CLI discovers the skill
        run: |
          npx -y skills@1.7.0 add . --list 2>&1 | tee list.txt
          grep -q "karpathy-explain" list.txt
